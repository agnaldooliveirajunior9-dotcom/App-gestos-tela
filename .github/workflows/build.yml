name: Gerar APK Grátis
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pegar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Configurar o Java (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Cordova e Compilar
        run: |
          npm install -g cordova
          cordova create appcom br.com.meuapp MeuApp
          cd appcom
          rm -rf www
          cp -r ../* www/ || true
          cordova platform add android
          cordova build android --no-telemetry

      - name: Disponibilizar o APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: meu-aplicativo-apk
          path: appcom/platforms/android/app/build/outputs/apk/debug/app-debug.apk
